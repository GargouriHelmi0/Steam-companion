<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Companion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page">
        <div class="left-side">
            <div class="left-overlay"></div>
            <div class="left-content">
                <div class="logo">Steam Companion</div>
            </div>
        </div>

        <div class="right-side">
            <div class="right-bg"></div>
            
            <div class="login-box">
                <div class="login-header">
                    <h2>Welcome back</h2>
                    <p>Enter your Steam ID to continue</p>
                </div>

                <form method="POST" action="/" id="loginForm">
                    <div class="input-group">
                        <label for="steam_id">Steam ID</label>
                        <input 
                            type="text"
                            id="steam_id"
                            name="steam_id"
                            placeholder="e.g. 76561198000000000"
                            autocomplete="off"
                        >
                        <span class="input-hint">Find it on your Steam profile URL</span>
                        <span class="input-hint">sample profile : 76561199130020695</span>
                    </div>

                    <button type="submit" id="submitBtn">
                        Continue
                    </button>
                </form>

                <div class="login-footer">
                    <p>We only access <strong>public</strong> profile data</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const guideLink = document.getElementById('guideLink');
        const guideModal = document.getElementById('guideModal');
        const modalClose = document.getElementById('modalClose');

        form.addEventListener('submit', () => {
            btn.disabled = true;
            btn.textContent = 'Loading...';
        });

        guideLink.addEventListener('click', (e) => {
            e.preventDefault();
            guideModal.classList.add('active');
        });

        modalClose.addEventListener('click', () => {
            guideModal.classList.remove('active');
        });

        guideModal.addEventListener('click', (e) => {
            if (e.target === guideModal) {
                guideModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
